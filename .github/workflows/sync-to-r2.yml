name: Sync to R2

on:
  workflow_call:
    inputs:
      tenant_id:
        description: Tenant identifier (defaults to repo name)
        required: false
        type: string
    secrets:
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      R2_ENDPOINT:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      MYCOURSE_OFFLINE_BUNDLE_KEY:
        required: false

env:
  TENANT_ID: ${{ inputs.tenant_id || github.event.repository.name }}

jobs:
  sync:
    name: Sync changed content to R2
    runs-on: ubuntu-latest
    outputs:
      offline_enabled: ${{ steps.offline.outputs.enabled }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 2

      - name: Check widgets for CDN and remote dependencies
        uses: mycourse-work/.github/.github/actions/check-widget-dependencies@main

      - name: Detect changed files
        id: changes
        run: |
          # Get changed files in modules/, courses/, and widgets/
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- modules/ courses/ widgets/ 2>/dev/null || echo "")
          if [ -z "$CHANGED" ]; then
            echo "No content files changed"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changed files:"
            echo "$CHANGED"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "$CHANGED" > /tmp/changed-files.txt
          fi

      - name: Install rclone
        if: steps.changes.outputs.has_changes == 'true'
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configure rclone for R2
        if: steps.changes.outputs.has_changes == 'true'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = ${R2_ENDPOINT}
          no_check_bucket = true
          EOF
          sed -i 's/^          //' ~/.config/rclone/rclone.conf

      - name: Upload changed files to R2
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          # Filter to only files that exist (skip deletes)
          > /tmp/upload-files.txt
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              echo "$file" >> /tmp/upload-files.txt
            else
              echo "Skipping deleted file: ${file}"
            fi
          done < /tmp/changed-files.txt

          FILE_COUNT=$(wc -l < /tmp/upload-files.txt | tr -d ' ')
          echo "Uploading ${FILE_COUNT} files to R2 (8 parallel transfers)..."
          cat /tmp/upload-files.txt

          # Upload all changed files in parallel using --files-from
          # Maps: modules/foo/bar.md → tenants/{TENANT_ID}/modules/foo/bar.md
          rclone copy . "r2:course-viewer-content/tenants/${TENANT_ID}" \
            --files-from /tmp/upload-files.txt \
            --transfers 8 \
            --verbose \
            --stats-one-line
          echo "Sync complete"

      - name: Register content in D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node << 'REGISTER_SCRIPT'
          const fs = require('fs');
          const path = require('path');

          const PLATFORM_DB_ID = '7f5cc97d-9745-471c-bc3d-b2f208b42ae8';
          const TENANT_ID = process.env.TENANT_ID;
          const ACCOUNT_ID = process.env.CLOUDFLARE_ACCOUNT_ID;
          const API_TOKEN = process.env.CLOUDFLARE_API_TOKEN;

          if (!TENANT_ID || !ACCOUNT_ID || !API_TOKEN) {
            console.log('Cloudflare credentials not configured, skipping D1 registration');
            process.exit(0);
          }

          const MAX_PARAMS_PER_STMT = 96;
          const MAX_SQL_BYTES = 64 * 1024;
          const MAX_BATCH_STATEMENTS = 50;
          const MAX_BATCH_BYTES = 512 * 1024;

          async function d1Request(dbId, payload, expectedCount) {
            const res = await fetch(
              'https://api.cloudflare.com/client/v4/accounts/' + ACCOUNT_ID + '/d1/database/' + dbId + '/query',
              {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + API_TOKEN, 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              }
            );
            const data = await res.json().catch(function() { return null; });
            if (!res.ok || !data || data.success !== true) {
              var msg = (data && data.errors && data.errors[0] && data.errors[0].message) || ('D1 error ' + res.status);
              throw new Error(msg);
            }
            if (!Array.isArray(data.result) || data.result.length !== expectedCount) {
              throw new Error('D1 returned ' + (Array.isArray(data.result) ? data.result.length : 0) + ' result(s), expected ' + expectedCount);
            }
            for (var i = 0; i < data.result.length; i++) {
              if (!data.result[i] || data.result[i].success !== true) {
                var stmtErr = (data.result[i] && data.result[i].error) || 'statement failed';
                throw new Error('D1 statement #' + i + ' failed: ' + stmtErr);
              }
            }
            return data.result;
          }

          async function d1Query(dbId, sql, params) {
            var results = await d1Request(dbId, { sql: sql, params: params || [] }, 1);
            return results[0].results || [];
          }

          async function d1Batch(dbId, statements) {
            if (!statements.length) return;
            await d1Request(dbId, { batch: statements }, statements.length);
          }

          function buildMultiRowStatements(prefixSql, rowPlaceholder, suffixSql, rows) {
            var statements = [];
            if (!rows.length) return statements;
            var baseBytes = Buffer.byteLength(prefixSql) + Buffer.byteLength(suffixSql);
            var placeholderBytes = Buffer.byteLength(rowPlaceholder) + 2;
            var chunkPlaceholders = [];
            var chunkParams = [];
            var chunkSqlBytes = baseBytes;

            function flush() {
              if (!chunkPlaceholders.length) return;
              statements.push({
                sql: prefixSql + chunkPlaceholders.join(', ') + suffixSql,
                params: chunkParams
              });
              chunkPlaceholders = [];
              chunkParams = [];
              chunkSqlBytes = baseBytes;
            }

            for (var i = 0; i < rows.length; i++) {
              var row = rows[i];
              if (chunkPlaceholders.length > 0 &&
                  (chunkParams.length + row.length > MAX_PARAMS_PER_STMT ||
                   chunkSqlBytes + placeholderBytes > MAX_SQL_BYTES)) {
                flush();
              }
              chunkPlaceholders.push(rowPlaceholder);
              for (var j = 0; j < row.length; j++) chunkParams.push(row[j]);
              chunkSqlBytes += placeholderBytes;
            }
            flush();
            return statements;
          }

          function packBatches(groups) {
            var batches = [];
            var current = [];
            var currentBytes = 12; // {"batch":[]}

            for (var i = 0; i < groups.length; i++) {
              var group = groups[i];
              if (!group.length) continue;
              var groupBytes = 0;
              for (var j = 0; j < group.length; j++) {
                groupBytes += Buffer.byteLength(JSON.stringify(group[j])) + 1;
              }
              if (current.length > 0 &&
                  (current.length + group.length > MAX_BATCH_STATEMENTS ||
                   currentBytes + groupBytes > MAX_BATCH_BYTES)) {
                batches.push(current);
                current = [];
                currentBytes = 12;
              }
              for (var k = 0; k < group.length; k++) current.push(group[k]);
              currentBytes += groupBytes;
            }
            if (current.length) batches.push(current);
            return batches;
          }

          function readJson(filePath) {
            try { return JSON.parse(fs.readFileSync(filePath, 'utf-8')); }
            catch (e) { return null; }
          }

          function listDirs(dirPath) {
            try {
              return fs.readdirSync(dirPath, { withFileTypes: true })
                .filter(function(d) { return d.isDirectory(); })
                .map(function(d) { return d.name; });
            } catch (e) { return []; }
          }

          function listWidgetFiles() {
            try {
              return fs.readdirSync('widgets').filter(function(f) { return f.endsWith('.html'); });
            } catch (e) { return []; }
          }

          async function main() {
            console.log('Registering content for tenant: ' + TENANT_ID);

            var rows = await d1Query(PLATFORM_DB_ID,
              'SELECT database_id FROM tenant_registry WHERE id = ? LIMIT 1', [TENANT_ID]);
            if (!rows.length) throw new Error('Tenant "' + TENANT_ID + '" not found in registry');
            var dbId = rows[0].database_id;
            console.log('Tenant DB: ' + dbId);

            var moduleCount = 0, courseCount = 0, widgetCount = 0;
            var moduleManifests = {};
            var moduleRows = [];
            var courseRows = [];
            var courseJunctions = [];
            var widgetRows = [];

            // Collect modules
            var moduleDirs = listDirs('modules');
            for (var mi = 0; mi < moduleDirs.length; mi++) {
              var dir = moduleDirs[mi];
              var manifest = readJson(path.join('modules', dir, 'manifest.json'));
              if (!manifest) continue;
              var id = manifest.id || dir;
              moduleManifests[id] = manifest;

              var lessons = (manifest.lessons || []).filter(function(l) { return l.type !== 'quiz'; }).length;
              var quizzes = (manifest.lessons || []).filter(function(l) { return l.type === 'quiz'; }).length;

              moduleRows.push([
                id,
                'tenants/' + TENANT_ID + '/modules/' + id,
                manifest.title || id,
                manifest.description || null,
                lessons,
                quizzes
              ]);
              console.log('  Module: ' + id + ' (' + lessons + ' lessons, ' + quizzes + ' quizzes)');
              moduleCount++;
            }

            // Collect courses and course_modules junctions
            var courseDirs = listDirs('courses');
            for (var ci = 0; ci < courseDirs.length; ci++) {
              var cdir = courseDirs[ci];
              var course = readJson(path.join('courses', cdir, 'course.json'));
              if (!course) continue;
              var cid = course.id || cdir;
              var moduleIds = course.modules || [];

              var totalLessons = 0, totalQuizzes = 0;
              for (var j = 0; j < moduleIds.length; j++) {
                var mod = moduleManifests[moduleIds[j]];
                if (mod) {
                  totalLessons += (mod.lessons || []).filter(function(l) { return l.type !== 'quiz'; }).length;
                  totalQuizzes += (mod.lessons || []).filter(function(l) { return l.type === 'quiz'; }).length;
                }
              }

              courseRows.push([
                cid,
                'tenants/' + TENANT_ID + '/courses/' + cid,
                'tenants/' + TENANT_ID + '/courses/' + cid + '/course.json',
                course.title || cid,
                course.description || null,
                moduleIds.length,
                totalLessons,
                totalQuizzes,
                course.coverImage || null
              ]);
              courseJunctions.push({ cid: cid, moduleIds: moduleIds });
              console.log('  Course: ' + cid + ' (' + moduleIds.length + ' modules, ' + totalLessons + ' lessons)');
              courseCount++;
            }

            // Collect widgets
            var widgetFiles = listWidgetFiles();
            for (var wi = 0; wi < widgetFiles.length; wi++) {
              var wfile = widgetFiles[wi];
              var wid = wfile.replace('.html', '');
              var wtitle = wid.split('-').map(function(w) { return w[0].toUpperCase() + w.slice(1); }).join(' ');

              widgetRows.push([
                wid,
                wtitle,
                'tenants/' + TENANT_ID + '/widgets/' + wfile,
                'widgets/' + wfile
              ]);
              console.log('  Widget: ' + wid);
              widgetCount++;
            }

            // Build ordered statement groups (modules -> courses -> per-course junction rebuild -> widgets)
            var groups = [];

            var moduleStmts = buildMultiRowStatements(
              'INSERT INTO modules (id, r2_base_path, title, description, total_lessons, total_quizzes, status) VALUES ',
              "(?, ?, ?, ?, ?, ?, 'active')",
              " ON CONFLICT(id) DO UPDATE SET title=excluded.title, description=excluded.description, total_lessons=excluded.total_lessons, total_quizzes=excluded.total_quizzes, updated_at=datetime('now')",
              moduleRows
            );
            for (var ms = 0; ms < moduleStmts.length; ms++) groups.push([moduleStmts[ms]]);

            var courseStmts = buildMultiRowStatements(
              'INSERT INTO courses (id, r2_base_path, r2_manifest_path, title, description, total_modules, total_lessons, total_quizzes, cover_image, access_type, status, manifest_format) VALUES ',
              "(?, ?, ?, ?, ?, ?, ?, ?, ?, 'public', 'active', 'blueprint')",
              " ON CONFLICT(id) DO UPDATE SET title=excluded.title, description=excluded.description, total_modules=excluded.total_modules, total_lessons=excluded.total_lessons, total_quizzes=excluded.total_quizzes, cover_image=excluded.cover_image, updated_at=datetime('now')",
              courseRows
            );
            for (var cs = 0; cs < courseStmts.length; cs++) groups.push([courseStmts[cs]]);

            // Keep each course's DELETE + INSERT(s) in one atomic group so a batch split cannot leave a course empty.
            for (var cj = 0; cj < courseJunctions.length; cj++) {
              var entry = courseJunctions[cj];
              var group = [{ sql: 'DELETE FROM course_modules WHERE course_id = ?', params: [entry.cid] }];
              var junctionRows = [];
              for (var k = 0; k < entry.moduleIds.length; k++) {
                junctionRows.push([entry.cid, entry.moduleIds[k], 'core-' + k, k]);
              }
              var insertStmts = buildMultiRowStatements(
                'INSERT INTO course_modules (course_id, module_id, slot_id, slot_type, slot_order) VALUES ',
                "(?, ?, ?, 'core', ?)",
                '',
                junctionRows
              );
              for (var is = 0; is < insertStmts.length; is++) group.push(insertStmts[is]);
              groups.push(group);
            }

            var widgetStmts = buildMultiRowStatements(
              'INSERT INTO widgets (id, title, r2_path, github_path, status) VALUES ',
              "(?, ?, ?, ?, 'active')",
              " ON CONFLICT(id) DO UPDATE SET r2_path=excluded.r2_path, github_path=excluded.github_path, updated_at=datetime('now')",
              widgetRows
            );
            for (var ws = 0; ws < widgetStmts.length; ws++) groups.push([widgetStmts[ws]]);

            var batches = packBatches(groups);
            var totalStatements = 0;
            for (var bi = 0; bi < batches.length; bi++) {
              totalStatements += batches[bi].length;
              await d1Batch(dbId, batches[bi]);
            }

            console.log('\nRegistered ' + courseCount + ' courses, ' + moduleCount + ' modules, ' + widgetCount + ' widgets (' + totalStatements + ' SQL statements in ' + batches.length + ' D1 batch call' + (batches.length === 1 ? '' : 's') + ')');
          }

          main().catch(function(err) { console.error('D1 registration failed:', err.message); process.exit(1); });
          REGISTER_SCRIPT

      - name: Check offline publishing configuration
        id: offline
        if: github.ref == 'refs/heads/main'
        env:
          WRAPPING_KEY: ${{ secrets.MYCOURSE_OFFLINE_BUNDLE_KEY }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          D1_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$WRAPPING_KEY" ]; then
            exit 0
          fi
          if [ "$REPOSITORY_PRIVATE" != 'true' ]; then
            echo "::warning::The offline packaging action is shared with private MyCourse content repositories."
            exit 0
          fi
          if [ -z "$D1_ACCOUNT" ] || [ -z "$D1_TOKEN" ]; then
            echo "::warning::Offline packaging requires the Cloudflare credentials used to register the publication."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

  offline:
    name: Package offline downloads
    needs: sync
    if: needs.sync.outputs.offline_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: mycourse-offline-${{ inputs.tenant_id || github.event.repository.name }}
      cancel-in-progress: false
    steps:
      - name: Publish encrypted offline copies to R2
        uses: mycourse-work/course.platform/.github/actions/package-offline-courses@main
        with:
          tenant-id: ${{ inputs.tenant_id || github.event.repository.name }}
          wrapping-key: ${{ secrets.MYCOURSE_OFFLINE_BUNDLE_KEY }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-endpoint: ${{ secrets.R2_ENDPOINT }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
