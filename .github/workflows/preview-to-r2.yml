name: Preview PR in R2

on:
  workflow_call:
    inputs:
      tenant_id:
        description: Tenant identifier (defaults to repo name)
        required: false
        type: string
    secrets:
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      R2_ENDPOINT:
        required: true

env:
  TENANT_ID: ${{ inputs.tenant_id || github.event.repository.name }}
  PR_NUMBER: ${{ github.event.pull_request.number }}

permissions:
  contents: read

concurrency:
  group: mycourse-preview-${{ inputs.tenant_id || github.event.repository.name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

jobs:
  sync-preview:
    name: Sync PR preview overlay to R2
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          lfs: true

      - name: Check widgets for CDN and remote dependencies
        uses: mycourse-work/.github/.github/actions/check-widget-dependencies@main

      - name: Stage changed content for overlay
        id: stage
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          STAGE_DIR="${RUNNER_TEMP}/preview-stage"
          rm -rf "${STAGE_DIR}"
          mkdir -p "${STAGE_DIR}"

          git fetch --no-tags origin "${BASE_REF}"
          MERGE_BASE=$(git merge-base "origin/${BASE_REF}" HEAD)
          CHANGED=$(git diff --name-only "${MERGE_BASE}" HEAD -- modules/ courses/ widgets/ || true)

          FILE_COUNT=0
          if [ -n "${CHANGED}" ]; then
            while IFS= read -r file; do
              [ -z "${file}" ] && continue
              if [ -f "${file}" ]; then
                mkdir -p "${STAGE_DIR}/$(dirname "${file}")"
                cp -- "${file}" "${STAGE_DIR}/${file}"
                FILE_COUNT=$((FILE_COUNT + 1))
              fi
            done <<< "${CHANGED}"
          fi

          node -e '
            const fs = require("fs");
            const meta = {
              tenant: process.env.TENANT_ID,
              pr: Number(process.env.PR_NUMBER),
              ref: process.env.HEAD_REF,
              sha: process.env.HEAD_SHA,
              fileCount: Number(process.env.FILE_COUNT),
              syncedAt: new Date().toISOString(),
            };
            fs.writeFileSync(process.env.STAGE_DIR + "/_meta.json", JSON.stringify(meta, null, 2));
          ' FILE_COUNT="${FILE_COUNT}" STAGE_DIR="${STAGE_DIR}"

          echo "file_count=${FILE_COUNT}" >> "$GITHUB_OUTPUT"
          echo "stage_dir=${STAGE_DIR}" >> "$GITHUB_OUTPUT"
          echo "Staged ${FILE_COUNT} changed content file(s) for tenants/${TENANT_ID}/_preview/${PR_NUMBER}/"

      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configure rclone for R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = ${R2_ENDPOINT}
          no_check_bucket = true
          EOF
          sed -i 's/^          //' ~/.config/rclone/rclone.conf

      - name: Sync overlay to R2
        run: |
          set -euo pipefail
          # Only writes to the isolated PR preview prefix; never touches live content or D1.
          rclone sync "${{ steps.stage.outputs.stage_dir }}" \
            "r2:course-viewer-content/tenants/${TENANT_ID}/_preview/${PR_NUMBER}" \
            --transfers 8 \
            --verbose \
            --stats-one-line
          echo "Preview overlay synced to tenants/${TENANT_ID}/_preview/${PR_NUMBER}/"

  cleanup-preview:
    name: Delete PR preview overlay from R2
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configure rclone for R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${R2_ACCESS_KEY_ID}
          secret_access_key = ${R2_SECRET_ACCESS_KEY}
          endpoint = ${R2_ENDPOINT}
          no_check_bucket = true
          EOF
          sed -i 's/^          //' ~/.config/rclone/rclone.conf

      - name: Delete preview overlay prefix
        run: |
          set -euo pipefail
          TARGET="r2:course-viewer-content/tenants/${TENANT_ID}/_preview/${PR_NUMBER}"
          echo "Deleting preview overlay at ${TARGET}..."
          rclone delete "${TARGET}" --verbose || true
          rclone rmdirs "${TARGET}" || true
          echo "Preview overlay cleanup complete"
